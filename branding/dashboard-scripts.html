<!-- Tema "Virtus" do Atendimento Wendell. Injetado pelo InstallationConfig DASHBOARD_SCRIPTS.
     Fonte: /home/infra/deploy/chatwoot/branding/dashboard-scripts.html (aplicar com scripts/apply-branding.sh)
     Paleta oficial: verde-escuro #1B3033, dourado #D6A45E, branco #FFFFFF.
     O tema liga/desliga pelo botão na borda direita; a escolha fica salva no navegador de cada pessoa. -->
<style id="virtus-theme-style">
  /* Base: variáveis do modo escuro do Chatwoot reescritas na paleta Virtus */
  body.virtus.dark {
    --slate-1: 18 33 35; --slate-2: 22 40 43; --slate-3: 30 53 56; --slate-4: 36 61 64;
    --slate-5: 43 70 73; --slate-6: 52 81 84; --slate-7: 66 97 100; --slate-8: 88 118 120;
    --slate-9: 104 132 134; --slate-10: 120 146 148; --slate-11: 196 208 206; --slate-12: 255 255 255;

    --blue-1: 30 34 32; --blue-2: 38 40 34; --blue-3: 60 52 36; --blue-4: 78 64 40;
    --blue-5: 98 78 46; --blue-6: 120 94 54; --blue-7: 148 114 64; --blue-8: 182 140 78;
    --blue-9: 214 164 94; --blue-10: 224 178 112; --blue-11: 232 196 140; --blue-12: 246 228 200;

    --background-color: 27 48 51; --surface-1: 22 40 43; --surface-2: 25 44 47; --surface-active: 43 70 73;
    --solid-1: 30 53 56; --solid-2: 34 59 62; --solid-3: 43 70 73; --solid-active: 52 81 84;
    --solid-blue: 78 64 40; --solid-blue-2: 30 53 56;
    --card-color: 30 53 56; --button-color: 36 61 64; --label-background: 34 59 62;
    --border-strong: 52 81 84; --border-weak: 36 61 64; --border-blue: 214, 164, 94, 0.5; --border-blue-strong: 232 196 140;
    --text-blue: 246 228 200;
    --alpha-1: 30, 53, 56, 0.85; --alpha-3: 27, 48, 51, 0.95;
  }
  /* A cor "brand" do Chatwoot é fixa (#2781F6) e não usa variável: troca direta pelo dourado */
  body.virtus .bg-n-brand { background-color: #D6A45E !important; }
  body.virtus .bg-n-brand.text-white, body.virtus .bg-n-brand .text-white { color: #1B3033 !important; }
  body.virtus .text-n-brand { color: #D6A45E !important; }
  body.virtus .border-n-brand { border-color: #D6A45E !important; }
  body.virtus .outline-n-brand { outline-color: #D6A45E !important; }
  body.virtus ::selection { background: rgba(214, 164, 94, 0.35); }

  /* Ícone sol/lua ao lado do nome da conta, no topo da barra lateral */
  #virtus-theme-toggle {
    display: inline-grid; place-content: center; flex-shrink: 0; width: 22px; height: 22px;
    margin-left: auto; border-radius: 6px; cursor: pointer;
    color: rgb(var(--slate-10)); transition: color .15s, background-color .15s;
  }
  #virtus-theme-toggle:hover { color: #D6A45E; background-color: rgba(214, 164, 94, .12); }
  #virtus-theme-toggle:focus-visible { outline: 2px solid #D6A45E; outline-offset: 1px; }
  #virtus-theme-toggle svg { width: 15px; height: 15px; }
  body.virtus #virtus-theme-toggle { color: #D6A45E; }
</style>
<script id="virtus-theme-script">
(function () {
  var KEY = 'virtusTheme';
  var read = function () { try { return localStorage.getItem(KEY) === 'on'; } catch (e) { return false; } };
  var save = function (on) { try { localStorage.setItem(KEY, on ? 'on' : 'off'); } catch (e) {} };
  var on = read();

  // O Chatwoot troca a classe "dark" do body conforme a aparência escolhida;
  // com o tema Virtus ligado, ela precisa continuar presente.
  var keepDark = new MutationObserver(function () {
    if (on && !document.body.classList.contains('dark')) document.body.classList.add('dark');
  });

  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">' +
    '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

  // Fica dentro do botão do nome da conta; por isso é um span com papel de botão
  // e o clique não chega ao seletor de contas.
  var toggle = document.createElement('span');
  toggle.id = 'virtus-theme-toggle';
  toggle.setAttribute('role', 'button');
  toggle.tabIndex = 0;

  function apply() {
    document.body.classList.toggle('virtus', on);
    if (on) {
      document.body.classList.add('dark');
      document.documentElement.style.setProperty('color-scheme', 'dark');
      keepDark.observe(document.body, { attributes: true, attributeFilter: ['class'] });
    }
    // Sol = ligar as cores do Grupo Virtus; lua = voltar ao modo escuro padrão
    toggle.innerHTML = on ? MOON : SUN;
    toggle.title = on ? 'Voltar ao modo escuro padrão' : 'Usar as cores do Grupo Virtus';
    toggle.setAttribute('aria-label', toggle.title);
    toggle.setAttribute('aria-pressed', String(on));
  }

  function flip(event) {
    event.preventDefault();
    event.stopPropagation();
    on = !on;
    save(on);
    // Ao desligar, recarrega para o Chatwoot reaplicar a aparência escolhida pela pessoa
    if (on) apply(); else window.location.reload();
  }
  toggle.addEventListener('click', flip);
  toggle.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' || event.key === ' ') flip(event);
  });

  // O Vue recria a barra lateral (troca de conta, recolher/expandir): recoloca o ícone quando some.
  var placing = false;
  function place() {
    placing = false;
    var host = document.getElementById('sidebar-account-switcher');
    if (host && toggle.parentNode !== host) host.appendChild(toggle);
  }
  new MutationObserver(function () {
    if (!placing) { placing = true; requestAnimationFrame(place); }
  }).observe(document.body, { childList: true, subtree: true });

  apply();
  place();
})();
</script>

<!-- Envio pelo Chatwoot bloqueado (o atendimento é na Blip): a caixa de resposta fica sempre em
     "Mensagem Privada" e a opção "Responder" some. O bloqueio real é no servidor
     (patches/zz_virtus_block_whatsapp_send.rb); isto só evita tentativas na tela. -->
<style id="virtus-reply-lock-style">
  button[data-virtus-locked] { pointer-events: none; }
  button[data-virtus-locked] > div:first-child { display: none; }
  button[data-virtus-locked] > div:last-child { display: none; } /* chip deslizante do seletor */
  .virtus-reply-lock-hint {
    font: 500 12px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: rgb(var(--slate-10)); margin-inline-start: 8px; white-space: nowrap;
  }
</style>
<script id="virtus-reply-lock-script">
(function () {
  var REPLY = ['Responder', 'Reply'];
  var NOTE = ['Mensagem Privada', 'Private Note', 'Nota privada'];

  function isModeToggle(btn) {
    var kids = btn.children;
    if (kids.length !== 3) return false;
    return REPLY.indexOf(kids[0].textContent.trim()) !== -1 && NOTE.indexOf(kids[1].textContent.trim()) !== -1;
  }

  // O chip do seletor fica em translate-x 0 quando o modo é "Responder"
  function inReplyMode(btn) {
    var chip = btn.children[2];
    return chip && (chip.style.getPropertyValue('--translate-x') || '0px').trim() === '0px';
  }

  function lock() {
    scheduled = false;
    var buttons = document.querySelectorAll('button');
    for (var i = 0; i < buttons.length; i++) {
      var btn = buttons[i];
      if (!isModeToggle(btn)) continue;
      if (inReplyMode(btn) && !btn.disabled) btn.click(); // passa para "Mensagem Privada"
      if (!btn.hasAttribute('data-virtus-locked')) {
        btn.setAttribute('data-virtus-locked', '');
        btn.title = 'Envio pelo Chatwoot desativado: responda o cliente pela Blip';
        var hint = document.createElement('span');
        hint.className = 'virtus-reply-lock-hint';
        hint.textContent = 'Somente nota interna · responda o cliente pela Blip';
        btn.insertAdjacentElement('afterend', hint);
      }
    }
  }

  var scheduled = false;
  new MutationObserver(function () {
    if (!scheduled) { scheduled = true; requestAnimationFrame(lock); }
  }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });
  lock();
})();
</script>

<!-- Dashboard IA: ícone ao lado do nome da conta (só para quem tem acesso) que abre /painel-ia em tela cheia -->
<style id="virtus-painel-style">
  #virtus-painel-btn {
    display: inline-grid; place-content: center; flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px;
    cursor: pointer; color: rgb(var(--slate-10)); transition: color .15s, background-color .15s;
  }
  #virtus-painel-btn { margin-left: auto; }
  #virtus-painel-btn + #virtus-theme-toggle { margin-left: 2px; }
  #virtus-painel-btn:hover { color: #D6A45E; background-color: rgba(214, 164, 94, .12); }
  #virtus-painel-btn:focus-visible { outline: 2px solid #D6A45E; outline-offset: 1px; }
  #virtus-painel-btn svg { width: 15px; height: 15px; }
  #virtus-painel-overlay { position: fixed; inset: 0; z-index: 10000; background: rgba(0, 0, 0, .45); display: none; }
  #virtus-painel-overlay.aberto { display: block; }
  #virtus-painel-overlay iframe { position: absolute; inset: 12px; width: calc(100% - 24px); height: calc(100% - 24px); border: 0; border-radius: 12px; background: #111315; }
  #virtus-painel-fechar {
    position: absolute; top: 20px; right: 28px; z-index: 1; border: 0; border-radius: 8px; padding: 6px 10px; cursor: pointer;
    font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; background: rgba(255, 255, 255, .12); color: #fff;
  }
</style>
<script id="virtus-painel-script">
(function () {
  var ICONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">' +
    '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>';
  var btn = document.createElement('span');
  btn.id = 'virtus-painel-btn';
  btn.setAttribute('role', 'button');
  btn.tabIndex = 0;
  btn.title = 'Dashboard de Atendimento';
  btn.setAttribute('aria-label', 'Abrir Dashboard de Atendimento');
  btn.innerHTML = ICONE;

  var overlay = document.createElement('div');
  overlay.id = 'virtus-painel-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-label', 'Dashboard de Atendimento');
  var fechar = document.createElement('button');
  fechar.id = 'virtus-painel-fechar';
  fechar.type = 'button';
  fechar.textContent = 'Fechar (Esc)';
  overlay.appendChild(fechar);
  document.body.appendChild(overlay);

  function tema() {
    var b = document.body.classList;
    return b.contains('virtus') ? 'virtus' : b.contains('dark') ? 'dark' : 'light';
  }
  function abrir(event) {
    event.preventDefault();
    event.stopPropagation();
    var antigo = overlay.querySelector('iframe');
    if (antigo) antigo.remove();
    var frame = document.createElement('iframe');
    frame.title = 'Dashboard de Atendimento';
    frame.src = '/painel-ia/?tema=' + tema();
    overlay.appendChild(frame);
    overlay.classList.add('aberto');
    fechar.focus();
  }
  function fecharPainel() {
    overlay.classList.remove('aberto');
    var f = overlay.querySelector('iframe');
    if (f) f.remove();
    btn.focus();
  }
  btn.addEventListener('click', abrir);
  btn.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') abrir(e); });
  fechar.addEventListener('click', fecharPainel);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && overlay.classList.contains('aberto')) fecharPainel(); });

  // Só mostra o ícone para quem tem acesso (a própria API confere o login)
  var liberado = false;
  fetch('/painel-ia/api/me', { credentials: 'same-origin', cache: 'no-store' })
    .then(function (r) { liberado = r.ok; colocar(); })
    .catch(function () {});

  var marcado = false;
  function colocar() {
    marcado = false;
    if (!liberado) return;
    var host = document.getElementById('sidebar-account-switcher');
    if (host && btn.parentNode !== host) {
      var tema = document.getElementById('virtus-theme-toggle');
      if (tema && tema.parentNode === host) host.insertBefore(btn, tema); else host.appendChild(btn);
    }
  }
  new MutationObserver(function () {
    if (!marcado) { marcado = true; requestAnimationFrame(colocar); }
  }).observe(document.body, { childList: true, subtree: true });
})();
</script>

<!-- Ícone da aba: remove os ícones padrão do Chatwoot (favicon-*, apple/android-icon) e deixa só o logo da instalação -->
<script id="virtus-favicon-script">
(function () {
  var nosso = window.globalConfig && window.globalConfig.LOGO_THUMBNAIL;
  if (!nosso) return;
  document.querySelectorAll('link[rel~="icon"], link[rel="apple-touch-icon"], link[rel="shortcut icon"]').forEach(function (l) { l.remove(); });
  var link = document.createElement('link');
  link.rel = 'icon';
  link.type = 'image/svg+xml';
  link.href = nosso;
  document.head.appendChild(link);
})();
</script>
